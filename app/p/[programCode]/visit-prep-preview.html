<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복냥이 · 방문 전 신청 준비</title>
<style>:root {
  color-scheme:light;
  --bg:#f2f6ff; --surface:#fff; --ink:#0b1e4d; --muted:#455679; --line:#d8e2f2;
  --brand:#0b1e4d; --brand-dark:#1f3c88; --soft:#dceeff; --point:#6fb3ff;
  --caution:#831d1d; --caution-bg:#fff4d5; --good:#1e6b3a; --good-bg:#def6ea;
  --shadow:0 14px 36px rgba(31,54,106,.08);
  font-family:"Noto Sans KR",Pretendard,"Malgun Gothic",system-ui,sans-serif;
  font-size:20px;
}
.large-text{font-size:24px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit}
button,select{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
button,a,input,select{outline-offset:4px}
:focus-visible{outline:3px solid #4779e9}
a{color:var(--brand);text-underline-offset:3px}
img{display:block;max-width:100%;height:auto}
h1,h2,h3,p,ul,ol,dl{margin:0}
h1{font-size:clamp(1.8rem,4.8vw,3.2rem);line-height:1.15;letter-spacing:-.05em}
h2{font-size:1.48rem;line-height:1.3;letter-spacing:-.035em}
h3{font-size:1.13rem;line-height:1.4;letter-spacing:-.025em}
.skip{position:absolute;top:8px;left:8px;padding:12px;background:#fff;z-index:5;transform:translateY(-150%)}
.skip:focus{transform:none}
.wrap{width:min(1140px,calc(100% - 64px));margin-inline:auto}
.topbar{background:rgba(255,255,255,.88);border-bottom:1px solid #e4eaf5}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;min-height:74px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-height:48px;padding:0;border:0;background:none;color:var(--ink);text-align:left}
.brand strong{font-size:1.38rem;letter-spacing:-.055em}
.brand-mark{display:grid;width:36px;height:36px;place-items:center;border-radius:12px;background:var(--brand);color:#fff;font-size:1.1rem}
.brand-sub{color:var(--muted);margin-left:3px;padding-left:14px;border-left:1px solid var(--line);font-size:.88rem}
.topbar-tools{display:flex;align-items:center;gap:12px}
.text-size{min-height:44px;padding:5px 10px;white-space:nowrap;font-size:.72rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;font-weight:700}
.text-size[aria-pressed="true"]{background:var(--soft);border-color:var(--brand-dark)}
.preview-note,.foot{color:var(--muted);font-size:.84rem}
.foot{padding-block:20px 32px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-block:24px 25px}
.step{min-width:0;display:flex;align-items:center;gap:9px;min-height:46px;padding:7px 10px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:var(--surface);font-size:.84rem;font-weight:700;white-space:nowrap}
.step.is-current{border-color:#b5c7ff;background:var(--soft);color:var(--brand-dark)}
.step.is-done{color:var(--ink)}
.step-count{display:grid;place-items:center;flex:0 0 23px;width:23px;height:23px;border-radius:50%;background:#edf2fa;color:#526483;font-size:.72rem}
.is-current .step-count{background:var(--brand);color:white}
.is-done .step-count{background:var(--good-bg);color:var(--good)}
.step-short{display:none}
.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;align-items:center;grid-template-columns:1.2fr .8fr;min-height:300px;
  border-radius:28px;padding:34px 42px;color:white;
  background:radial-gradient(ellipse at 81% 61%,#4272be 0%,#233f82 34%,#142657 69%,#0b193c 100%);
  box-shadow:0 17px 36px #1b315b2b}
.hero-copy{position:relative;z-index:2;max-width:610px}
.hero p{max-width:440px;margin-top:16px;color:#e0ebff;font-size:1.02rem}
.hero-figure{position:absolute;right:7%;bottom:6%;height:90%;width:29%;object-fit:contain;filter:drop-shadow(0 17px 18px rgba(6,13,37,.35))}
.hero-stage{position:absolute;right:4%;bottom:10%;height:24%;width:35%;border-radius:50%;transform:perspective(430px) rotateX(57deg);border:1px solid var(--point);background:radial-gradient(ellipse,#90c4fc99,#81a8ef50 62%,#5487cb55);box-shadow:0 22px 35px #0713314a}
.catalog{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.panel{padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.catalog .panel{padding:20px 22px}
.program-row{display:flex;gap:17px;align-items:center}
.program-icon{flex:none;display:grid;width:49px;height:49px;place-items:center;border-radius:14px;background:var(--soft);color:var(--brand);font-size:1.3rem}
.program-name{font-size:1.36rem;letter-spacing:-.028em;line-height:1.3}
.program-meta{margin-top:4px;color:var(--muted);font-size:.91rem}
.catalog-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:64px;padding:10px 19px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:750;text-decoration:none;text-align:center;line-height:1.38}
.btn-primary{color:white;background:var(--brand);border-color:var(--brand);box-shadow:0 4px 0 #07132e,0 8px 15px #24388b25}
.btn-primary:hover{background:var(--brand-dark)}
.btn-secondary{border-color:var(--brand-dark);border-width:2px}
.btn-secondary:hover{background:var(--soft)}
.btn-small{min-height:48px;padding:7px 13px;font-size:.87rem}
.btn-text{border-color:transparent;background:transparent;color:var(--brand);box-shadow:none;text-decoration:underline;text-underline-offset:4px}
.btn[aria-pressed="true"]{border:2px solid var(--brand);background:var(--soft);color:var(--brand-dark)}
.rows{display:grid;gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,0.58fr);align-items:start;gap:20px}
.stack{display:grid;gap:18px}
.subtle{color:var(--muted)}
.caption{font-size:.85rem;color:var(--muted)}
.screen-title{margin-bottom:19px}
.screen-title p{margin-top:8px;color:var(--muted)}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.panel-title:last-child{margin-bottom:0}
.panel-title h2{margin:0}
.meta-label{color:var(--brand-dark);font-size:.84rem;font-weight:750}
.question-top{display:grid;gap:9px;margin-bottom:20px}
.question-top h1{font-size:clamp(1.4rem,4.4vw,1.6rem)}
.question-layout{max-width:920px;margin-inline:auto}
.question-nav .btn{min-height:44px;padding:5px 9px;font-size:.82rem}
.field{display:grid;gap:6px}
.field label,.field-label{font-weight:700}
.amount-preview{color:var(--ink);font-size:1.08rem;font-weight:750}
.amount-preview:empty{display:none}
input,select{min-width:0;width:100%;min-height:57px;padding:10px 13px;border:1.5px solid #9eafd0;border-radius:11px;color:var(--ink);background:white}
input[type="checkbox"]{width:23px;min-height:23px;accent-color:var(--brand)}
select{padding-right:30px}
.options{display:grid;gap:10px}
.two-options{grid-template-columns:repeat(2,minmax(0,1fr))}
.action-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.action-row .btn-primary{margin-right:3px}
.notice{padding:14px;border-radius:12px;background:var(--soft);color:var(--ink)}
.notice p + p{margin-top:7px}
.notice-warn{background:var(--caution-bg);color:var(--caution)}
.notice-good{background:var(--good-bg);color:var(--good)}
.notice-neutral{background:#ecf3ff;color:#1b3c73}
.notice + .field{margin-top:12px}
.progress{width:100%;height:8px;border:0;border-radius:999px;overflow:hidden;background:#e5edfa;accent-color:var(--brand)}
.progress::-webkit-progress-bar{background:#e5edfa}
.progress::-webkit-progress-value{background:var(--brand)}
.role-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.role-list button{padding-inline:9px}
.list{list-style:none;padding:0}
.list li + li{border-top:1px solid #e4eaf5}
.line-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.line-row:first-child{padding-top:5px}
.line-row:last-child{padding-bottom:2px}
.line-row p{margin-top:3px}
.line-row strong{display:block}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0}
.check-row input{flex:none;margin:2px 0 0}
.check-row small{display:block;color:var(--muted);font-size:.86rem;margin-top:3px}
.marker{display:inline-block;padding:3px 8px;border-radius:8px;font-size:.79rem;font-weight:750;white-space:nowrap}
.marker-warn{background:var(--caution-bg);color:var(--caution)}
.marker-good{background:var(--good-bg);color:var(--good)}
.marker-neutral{background:#ecf0f8;color:var(--muted)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-block:0 14px}
.tabs .btn[aria-pressed="true"]{border:1px solid #acbff5}
.balance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.balance > div{padding:10px;border:1px solid var(--line);border-radius:12px}
.balance strong{display:block;font-size:1.32rem}
.card-data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 15px}
.card-data div{min-width:0;border-bottom:1px solid var(--line);padding:7px 0}
.card-data dt{font-size:.81rem;color:var(--muted)}
.card-data dd{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center;justify-content:space-between;font-weight:700}
.line-row > .btn{white-space:nowrap}
.gap-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.gap-links a{display:inline-flex;align-items:center;min-height:44px;padding:3px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--brand-dark);font-size:.8rem;font-weight:700}
.card-title{padding:20px 24px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-mascot{width:85px;height:85px;object-fit:contain;flex:none}
.card-title h1{color:var(--ink);font-size:clamp(1.65rem,4vw,2.6rem)}
.card-title p{margin-top:6px}
.summary-actions{position:sticky;bottom:0;z-index:3;display:flex;justify-content:flex-end;gap:9px;padding:12px 0;background:var(--bg)}
.status-live:empty{display:none}
#print-copy{display:none}
@media(max-width:920px){.wrap{width:calc(100% - 42px)}.catalog-actions{flex-wrap:wrap}.hero{padding-inline:30px}.step-long{display:none}.step-short{display:inline}}
@media(max-width:720px){
  .wrap{width:calc(100% - 30px)}.topbar-inner{min-height:59px;gap:7px}.brand{gap:7px}.brand-sub{display:none}
  .preview-note{font-size:.68rem}.brand-mark{width:30px;height:30px;border-radius:9px}.topbar-tools{gap:7px}
  .steps{gap:4px;margin-block:13px 15px}.step{justify-content:center;padding:5px 2px;gap:4px;min-height:41px;font-size:.72rem}
  .step-count{width:16px;height:16px;flex-basis:16px;font-size:.64rem}.step-long{display:none}.step-short{display:inline}
  .hero{min-height:220px;border-radius:20px;padding:19px 15px;grid-template-columns:1fr}
  .hero-copy{max-width:65%}.hero h1{font-size:clamp(1.34rem,6.2vw,2.55rem)}.hero p{font-size:.9rem;margin-top:11px}
  .hero-figure{right:1.5%;bottom:5%;width:36%;height:83%}.hero-stage{width:39%;right:0}
  .catalog,.split{grid-template-columns:1fr;gap:12px}.catalog{margin-top:12px}.catalog-actions{display:grid;gap:8px}
  .screen-title h1{font-size:clamp(1.45rem,5vw,2.05rem)}
  .panel,.catalog .panel{padding:15px}.program-row{gap:10px}.program-icon{width:39px;height:39px}
  .role-list{grid-template-columns:1fr}.action-row .btn{flex:1 1 auto}
  .tabs .btn{padding-inline:9px}.summary-actions .btn{flex:1;padding-inline:7px;font-size:.87rem}.card-title{padding:16px}
  .card-mascot{width:65px;height:65px}.question-aside{display:none}
}
@media(max-width:440px){.preview-description{display:none}.step-count{display:none}}
@media(max-width:380px){.step{font-size:.64rem}.hero h1{font-size:1.25rem}.card-data{grid-template-columns:1fr}}
@page{size:A4;margin:11mm}
@media print{
  body{background:#fff;color:#14203a;line-height:1.31;font:10pt/1.31 "Malgun Gothic",sans-serif}
  .skip,.topbar,#screen,.foot{display:none!important}
  #print-copy{display:block}
  #print-copy h1{font-size:19pt;letter-spacing:-.03em;margin-bottom:3mm}
  #print-copy h2{font-size:12pt;margin:3mm 0 1mm}
  .paper-meta{border-bottom:1px solid #60708d;padding-bottom:2mm;display:flex;justify-content:space-between;gap:5mm}
  .paper-cols{display:grid;grid-template-columns:1fr 1fr;gap:7mm;margin-bottom:3mm}
  .paper-list{list-style:none;padding:0}
  .paper-list li{padding:1mm 0;border-bottom:1px solid #dde3ec;break-inside:avoid}
  .paper-field{display:grid;grid-template-columns:1.14fr 1fr;gap:2mm}
  .paper-note{border-top:1px solid #60708d;padding:2mm 0}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<a class="skip" href="#screen">본문으로</a>
<header class="topbar"><div class="wrap topbar-inner">
  <button class="brand" type="button" data-action="home" aria-label="복냥이 시작 화면">
    <span class="brand-mark" aria-hidden="true">✦</span><strong>복냥이</strong>
    <span class="brand-sub">복지 신청 준비</span>

  <div class="topbar-tools">
    <p class="preview-note">체험용<span class="preview-description"> · 이 탭에서만 저장</span></p>

  </div>
</div></header>
<main class="wrap" id="screen">
  <nav id="steps" class="steps" aria-label="신청 준비 단계"></nav>
  <div id="view"></div>
</main>
<div id="print-copy"></div>
<footer class="wrap foot">받을 수 있는지는 구청에서 조사하고 정합니다.</footer>

  let inputMode = 'answer';
  let activeTab = 'answers';
  let pendingFocus = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
  const btn = (label, action, style = 'secondary', key) =>
    `<button class="btn btn-${style}" type="button" data-action="${action}"${key == null ? '' : ` data-key="${esc(key)}"`}>${esc(label)}</button>`;
  const link = (label, url, style = 'secondary') =>
    `<a class="btn btn-${style}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} <span aria-hidden="true">↗</span></a>`;

  function storeProgress() {
    try { sessionStorage.setItem(versionKey, JSON.stringify(state)); } catch { /* tab only */ }
  }

  function conditionValue(condition, context) {
    if (!condition) return true;
    if (Array.isArray(condition)) {
      const results = condition.map(item => conditionValue(item, context));
      if (results.includes(false)) return false;
      return results.includes(null) ? null : true;
    }
    const answer = context.get(condition.field);
    if (answer?.inactive) return false;
    if (answer?.status !== 'confirmed') return null;
    const { value } = answer;
    switch (condition.op) {
      case 'eq': return value === condition.value;
      case 'neq': return value !== condition.value;
      case 'in': return Array.isArray(condition.value) && condition.value.includes(value);
      case 'gt': return typeof value === 'number' && value > condition.value;
      case 'lt': return typeof value === 'number' && value < condition.value;
      default: return null;
    }
  }

  function readiness() {
    const context = new Map();
    const visible = [];
    for (const field of fields) {
      const show = conditionValue(field.show_if, context);
      if (show === true) {
        visible.push(field);
        context.set(field.key, state.answers[field.key]);
      } else {
        context.set(field.key, show === false ? { inactive: true } : null);
      }
    }
    const requiredDocs = documents.filter(doc => conditionValue(doc.condition, context) === true);
    const undecidedDocs = documents.filter(doc => conditionValue(doc.condition, context) === null);
    const activeChecks = checks.filter(check => conditionValue(check.condition, context) === true);
    const requiredFields = visible.filter(field => field.required);
    const missing = requiredFields.filter(field => context.get(field.key)?.status !== 'confirmed');
    const pendingDocs = requiredDocs.filter(doc => !state.documents[doc.sort_order]);
    const pendingChecks = activeChecks.filter(check => !state.checks[check.sort_order]);
    return {
      visible, requiredFields, missing, requiredDocs, undecidedDocs, activeChecks, pendingDocs, pendingChecks,
      ready: missing.length === 0 && pendingDocs.length === 0 && pendingChecks.length === 0 && undecidedDocs.length === 0,
    };
  }

  function fieldText(field, answer, printable = false) {
    if (!answer) return printable ? '미입력' : '아직 입력하지 않았어요';
    if (answer.status === 'unknown' || (printable && answer.status !== 'confirmed')) return '확인 필요';
    const value = answer.value;
    let formatted = String(value);
    if (field.type === 'money') formatted = moneyText(value);
    if (field.type === 'count') formatted = numbers.format(value) + '명';
    if (field.type === 'yes_no') formatted = value ? '있어요' : '없어요';
    if (field.type === 'choice') formatted = field.options?.find(option => option.value === value)?.label ?? formatted;
    return answer.status === 'approximate' ? '약 ' + formatted + ' · 확인 필요' : formatted;
  }

  function moneyText(value) {
    return value % 10000 === 0 && value >= 10000
      ? numbers.format(value / 10000) + '만 원' : numbers.format(value) + '원';
  }

  function previewAmount(field, value) {
    if (value === '' || !Number.isSafeInteger(Number(value)) || Number(value) < 0) return '';
    return (monthlyFields.has(field.key) ? '한 달에 ' : '') + moneyText(Number(value));
  }

  function go(target) {
    screen = target;
    if (target > 0) state.started = true;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    document.querySelector('#view h1')?.focus({ preventScroll: true });
  }

  function chooseField(key, from = null) {
    currentField = key;
    returnScreen = from;
    inputMode = 'answer';
    go(2);
  }

  function overview() {
    const preparation = readiness();
    const resume = state.started ? `<section class="panel panel-title">
      <div><h2>하던 신청 준비</h2><p class="subtle">${esc(program.name)}</p>
      ${Object.keys(state.answers).length ? `<p class="caption">${esc(nextTask(preparation))}</p>` : ''}</div>
      ${btn('남은 일부터 보기', 'resume')}
    </section>` : '';
    return `<div class="stack">${resume}
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title" tabindex="-1">주민센터 가기 전,<br>신청 준비부터</h1>
          <p>신청할 제도를 고르면 양식에 필요한 정보와 챙길 서류를 하나씩 확인할 수 있어요.</p>
        </div>
        <div class="hero-stage" aria-hidden="true"></div>
        <img class="hero-figure" src="${esc(mascot.hero)}" width="520" height="640" alt="">
      </section>
      <h2>어떤 복지를 신청하시나요?</h2>
    </div>
    <div class="catalog">
      <article class="panel">
        <div class="program-row"><span class="program-icon" aria-hidden="true">▤</span>
          <div><h3 class="program-name">${esc(program.name)}</h3>
            <p class="program-meta">방문 신청 · 주소지 관할 동주민센터</p>
          </div>
        </div>
      </article>
      <div class="catalog-actions">${btn('이 제도 준비하기 →', 'select', 'primary')}${state.started ? '' : btn('예시로 체험하기', 'sample')}</div>
    </div>`;
  }

  function formOverview() {
    const sections = [...new Set(fields.map(field => field.section))];
    const sectionLabels = sections.map(section => `<li>${esc(section)}</li>`).join('');
    return `<div class="screen-title">
      <h1 tabindex="-1">작성할 양식을 확인해요</h1>
      <p>먼저 서식과 작성 항목을 살펴보고, 아는 것부터 적어요.</p>
    </div>
    <div class="split">
      <div class="stack">
        <section class="panel">
          <div class="panel-title"><h2>${esc(program.name)}</h2></div>
          <p><strong>서울형 기초보장제도 신청서</strong></p>
          <p class="subtle">별지 제1호 서식과 신청에 필요한 제출서류를 확인할 수 있어요.</p>
          <div class="action-row">
            ${link('서울시 서식명·제출서류 확인', official.form)}
            ${link('복지로 제도 안내', official.guide, 'text')}
          </div>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>누가 작성하나요?</h2></div>
          <div class="role-list">${Object.entries(roles).map(([key, label]) =>
            `<button class="btn btn-secondary" type="button" data-action="role" data-key="${key}" aria-pressed="${key === state.helper}">${esc(label)}</button>`,
          ).join('')}</div>
          <div class="action-row">${btn('양식 항목 작성하기 →', 'start', 'primary')}${btn('제도 선택으로', 'home', 'text')}</div>
        </section>
      </div>
      <aside class="panel">
        <h2>함께 적을 항목</h2>
        <p class="subtle">답에 따라 필요한 항목만 이어서 나와요.</p>
        <ul class="list" style="margin-top:10px;display:grid;gap:5px">${sectionLabels}</ul>
        <p class="caption" style="margin-top:12px">시안에는 팀의 시연용 질문과 서류 규칙을 연결했습니다. 공식 서식과 대조해 적용 범위를 확정해야 해요.</p>
      </aside>
    </div>`;
  }

  function fieldControl(field, previous) {
    const kind = field.type;
    if (kind === 'yes_no') {
      return `<div class="options two-options">${btn('있어요', 'choice', 'secondary', 'yes')}${btn('없어요', 'choice', 'secondary', 'no')}</div>`;
    }
    if (kind === 'choice') {
      return `<div class="options">${(field.options ?? []).map((option, index) => btn(option.label, 'choice', 'secondary', String(index))).join('')}</div>`;
    }
    if (kind === 'district') {
      return `<form id="answer-form" class="field"><label for="response">사는 구</label>
        <select required id="response" name="response"><option value="">구를 골라 주세요</option>${districts.map(district => `<option${previous?.value === district ? ' selected' : ''}>${esc(district)}</option>`).join('')}</select>
        <div class="action-row"><button class="btn btn-primary" type="submit">저장하고 다음으로 →</button></div></form>`;
    }
    const numerical = kind === 'money' || kind === 'count';
    const unit = kind === 'money' ? '금액 (원)' : kind === 'count' ? '인원 (명)' : field.label;
    const input = numerical
      ? `type="number" inputmode="numeric" step="1"${field.min_value !== null ? ` min="${Number(field.min_value)}"` : ''}${field.max_value !== null ? ` max="${Number(field.max_value)}"` : ''}`
      : 'type="text" maxlength="80" autocomplete="off"';
    return `<form id="answer-form" class="field">
      <label for="response">${inputMode === 'approximate' ? '대략 아는 ' : ''}${esc(unit)}</label>
      <input required id="response" name="response" ${input} value="${esc(previous?.value)}">
      ${kind === 'money' ? `<output class="amount-preview" id="amount-preview" for="response">${esc(previewAmount(field, previous?.value ?? ''))}</output>` : ''}
      <div class="action-row"><button class="btn btn-primary" type="submit">${inputMode === 'approximate' ? '확인 필요로 남기기' : '저장하고 다음으로 →'}</button>
        ${inputMode === 'approximate' ? btn('돌아가기', 'abort-unknown', 'text') : ''}
      </div>
    </form>`;
  }

  function questionScreen(data) {
    const field = fieldByKey.get(currentField);
    if (!field) return '';
    const previous = state.answers[field.key];
    const ordinal = data.visible.indexOf(field) + 1;
    const answered = data.requiredFields.length - data.missing.length;
    const helperQuestion = state.helper === 'self' ? field.question_easy : field.question_helper;
    const help = field.check_guide || '주민센터에서 양식 항목을 보며 확인할 수 있어요.';
    const controls = inputMode === 'unknown'
      ? `<div class="notice notice-warn"><strong>어디서 확인해요?</strong><p>${esc(help)}</p></div>
        <div class="action-row">${btn('나중에 확인할게요', 'defer', 'primary')}${field.type === 'money' ? btn('대략은 알아요', 'approx') : ''}${btn('직접 입력할게요', 'abort-unknown', 'text')}</div>`
      : `<div class="stack">${fieldControl(field, previous)}${inputMode === 'answer' ? btn('잘 모르겠어요', 'unknown', 'secondary') : ''}</div>`;
    return `<div class="split question-layout">
      <section class="panel">
        <div class="question-top">
          <p class="meta-label">${ordinal} / ${data.visible.length} · ${esc(field.section)} · ${esc(field.label)}</p>
          <h1 tabindex="-1">${esc(helperQuestion)}</h1>
          ${field.help_easy && inputMode === 'answer' ? `<p class="subtle">${esc(field.help_easy)}</p>` : ''}
        </div>
        ${controls}
        <div class="action-row question-nav">
          ${btn(returnScreen === null ? '← 이전 항목' : '입력 취소하고 돌아가기', 'back-question', 'text')}
          ${returnScreen === null ? btn('빠진 항목 먼저 확인', 'gaps', 'text') : ''}
        </div>
      </section>
      <aside class="panel question-aside">
        <h2>작성 현황</h2>
        <p class="subtle">현재 질문 ${ordinal} / ${data.visible.length}</p>
        <progress class="progress" aria-label="확인해서 적은 필수 정보" value="${answered}" max="${Math.max(1, data.requiredFields.length)}"></progress>
        <p class="caption">확인해서 적은 필수 정보 ${answered} / ${data.requiredFields.length}</p>
        ${previous?.status === 'approximate' ? `<p class="notice notice-warn">${esc(fieldText(field, previous))}</p>` : ''}
      </aside>
    </div>`;
  }

  function missingInfo(data) {
    if (!data.missing.length) return '<p class="notice notice-good">필수 정보 확인을 마쳤어요.</p>';
    return `<ul class="list">${data.missing.map(field => {
      const answer = state.answers[field.key];
      const detail = answer?.status === 'approximate' ? `<p>${esc(fieldText(field, answer))}</p>` : '';
      return `<li class="line-row">
        <div><strong>${esc(field.label)}</strong>${detail}<p class="caption">${esc(field.check_guide || '양식의 이 항목을 확인해 주세요.')}</p></div>
        ${btn('입력하기', 'edit-field', 'small', field.key)}
      </li>`;
    }).join('')}</ul>`;
  }

  function docList(data, editable) {
    if (!data.requiredDocs.length) return '<p class="subtle">정해진 서류가 아직 없어요. 먼저 양식 정보를 확인해 주세요.</p>';
    const items = [...data.pendingDocs, ...data.requiredDocs.filter(doc => state.documents[doc.sort_order])];
    return `<ul class="list">${items.map(doc => {
      const done = !!state.documents[doc.sort_order];
      if (editable) {
        return `<li><label class="check-row"><input type="checkbox" data-doc="${doc.sort_order}"${done ? ' checked' : ''}>
          <span><strong>${esc(doc.doc_name)}</strong><small>${esc(doc.issue_place || groups[doc.place_group])}</small></span></label></li>`;
      }
      return `<li class="line-row"><div><strong>${esc(doc.doc_name)}</strong><p class="caption">${esc(doc.issue_place || groups[doc.place_group])}</p></div>
        <span class="marker ${done ? 'marker-good' : 'marker-warn'}">${done ? '챙김' : '필요'}</span></li>`;
    }).join('')}</ul>`;
  }

  function checkList(data) {
    const items = [...data.pendingChecks, ...data.activeChecks.filter(check => state.checks[check.sort_order])];
    if (!items.length) return '<p class="subtle">답변에 따라 내기 전에 확인할 일이 추가될 수 있어요.</p>';
    return `<ul class="list">${items.map(check => `<li><label class="check-row">
      <input type="checkbox" data-check="${check.sort_order}"${state.checks[check.sort_order] ? ' checked' : ''}>
      <span><strong>${esc(check.check_question)}</strong><small>${esc(check.fix_easy)}</small></span>
    </label></li>`).join('')}</ul>`;
  }

  function nextTask(data) {
    if (data.missing.length) return '먼저 확인할 정보 · ' + data.missing[0].label;
    if (data.pendingDocs.length) return '먼저 챙길 서류 · ' + data.pendingDocs[0].doc_name;
    if (data.pendingChecks.length) return '내기 전 점검이 ' + data.pendingChecks.length + '개 남았어요.';
    if (data.undecidedDocs.length) return '서류가 필요한지 ' + data.undecidedDocs.length + '개 더 확인해 주세요.';
    return '앱에 나온 정보와 서류를 모두 확인했어요.';
  }

  function statusNotice(data) {
    return data.ready
      ? `<p class="notice notice-good">${esc(nextTask(data))}</p>`
      : `<p class="notice notice-warn">${esc(nextTask(data))}</p>`;
  }

  function gapScreen(data) {
    const waiting = data.undecidedDocs.length;
    return `<div class="screen-title">
      <h1 tabindex="-1">빠진 항목을 확인해요</h1>
      <p>${esc(program.name)} · 주민센터 가기 전에 확인할 일</p>
    </div>
    ${statusNotice(data)}
    <nav class="gap-links" aria-label="준비할 항목 바로 가기">
      <a href="#gap-info">정보 ${data.missing.length}개</a>
      <a href="#gap-docs">서류 ${data.pendingDocs.length}개</a>
      <a href="#gap-checks">내기 전 점검 ${data.pendingChecks.length}개</a>
    </nav>
    <div class="split" style="margin-top:14px">
      <div class="stack">
        <section class="panel" id="gap-info" tabindex="-1">
          <div class="panel-title"><h2>확인할 정보</h2><span class="marker ${data.missing.length ? 'marker-warn' : 'marker-good'}">${data.missing.length}개</span></div>
          ${missingInfo(data)}
        </section>
        <section class="panel" id="gap-docs" tabindex="-1">
          <div class="panel-title"><h2>챙길 서류</h2><span class="marker ${data.pendingDocs.length ? 'marker-warn' : 'marker-good'}">${data.pendingDocs.length}개 남음</span></div>
          ${docList(data, true)}
          ${waiting ? `<p class="notice notice-warn">답을 확인한 뒤 필요한지 판단할 서류가 ${waiting}개 있어요.</p>` : ''}
        </section>
      </div>
      <aside class="panel" id="gap-checks" tabindex="-1"><div class="panel-title"><h2>내기 전 점검</h2><span class="marker marker-neutral">${data.pendingChecks.length}개 남음</span></div>
        <p class="caption">확인한 항목에 표시해 주세요. 시연용 점검 항목입니다.</p>
        ${checkList(data)}
      </aside>
    </div>
    <div class="summary-actions">${btn('정보 입력으로', 'edit', 'secondary')}${btn('준비 카드 보기 →', 'card', 'primary')}</div>`;
  }

  function answerRows(data) {
    if (!data.visible.length) return '<p class="subtle">작성한 정보가 아직 없어요.</p>';
    return `<dl class="card-data">${data.visible.map(field => `<div>
      <dt>${esc(field.label)}</dt><dd>${esc(fieldText(field, state.answers[field.key]))}
        <button type="button" class="btn btn-small" data-action="edit-card-field" data-key="${esc(field.key)}" aria-label="${esc(field.label)} 수정">수정</button>
      </dd>
    </div>`).join('')}</dl>`;
  }

  function officeSection() {
    return `<div class="stack"><div><h2>주소지 관할 동주민센터</h2>
      <p class="subtle">준비 카드와 챙긴 서류를 가져가세요.</p></div>
      <div class="notice notice-neutral"><strong>창구에서 할 말</strong><p>“${esc(program.name)} 신청하러 왔어요. 이 카드에 적은 정보와 챙겨 온 서류를 확인해 주세요.”</p></div>
      <div class="action-row">${link('서울시 방문 신청 안내', official.form)}${link('복지로 제도 안내', official.guide, 'text')}</div></div>`;
  }

  function cardScreen(data) {
    const cardTabs = [
      ['answers', '적을 정보'], ['documents', '챙길 서류'], ['visit', '방문할 곳'],
    ];
    const tabButtons = cardTabs.map(([key, label]) =>
      `<button type="button" class="btn btn-small" data-action="tab" data-key="${key}" aria-pressed="${activeTab === key}">${label}</button>`,
    ).join('');
    const panel = activeTab === 'documents' ? docList(data, false)
      : activeTab === 'visit' ? officeSection()
      : answerRows(data);
    const remaining = [
      data.pendingChecks.length ? `내기 전 점검 ${data.pendingChecks.length}개` : '',
      data.undecidedDocs.length ? `필요 여부를 확인할 서류 ${data.undecidedDocs.length}개` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="stack">
      <section class="card-title notice ${data.ready ? 'notice-good' : 'notice-warn'}">
        <div><h1 tabindex="-1">방문 준비 카드</h1>
        <p><strong>${data.ready ? '앱에서 안내한 준비를 마쳤어요' : '확인할 항목이 남아 있어요'}</strong> · ${esc(program.name)}</p></div>
        <img class="card-mascot" src="${esc(mascot.card)}" width="85" height="85" alt="">
      </section>
      <div class="split">
        <section class="panel">
          <div class="tabs" aria-label="준비 카드 내용">${tabButtons}</div>
          ${panel}
        </section>
        <aside class="panel stack">
          <h2>출발 전 확인</h2>
          <div class="balance"><div><strong>${data.missing.length}</strong><span>확인할 정보</span></div><div><strong>${data.pendingDocs.length}</strong><span>챙길 서류</span></div></div>
          ${remaining ? `<p class="caption">${esc(remaining)}</p>` : ''}
          <p class="subtle">작성한 내용을 공식 신청서에 옮겨 적고, 서명과 제출 안내는 창구에서 확인해요.</p>
          ${btn('카드 인쇄하기', 'print', 'primary')}
          ${btn('빠진 항목 다시 보기', 'gaps')}
        </aside>
      </div>
    </div>`;
  }

  function printCard(data) {
    const row = field => `<li class="paper-field"><span>${esc(field.label)}</span><strong>${esc(fieldText(field, state.answers[field.key], true))}</strong></li>`;
    const checked = data.requiredDocs.map(doc => `<li>${state.documents[doc.sort_order] ? '✓' : '□'} ${esc(doc.doc_name)}</li>`).join('');
    printCopy.innerHTML = `<article>
      <h1>복냥이 방문 준비 카드</h1>
      <div class="paper-meta"><strong>${esc(program.name)}</strong><span>${data.ready ? '앱에서 확인할 준비 완료' : '확인할 항목 남음'}</span></div>
      <div class="paper-cols">
        <section><h2>양식에 옮겨 적을 정보</h2><ul class="paper-list">${data.visible.map(row).join('')}</ul></section>
        <section><h2>챙길 서류</h2><ul class="paper-list">${checked}</ul>
          <h2>방문할 곳</h2><p>주소지 관할 동주민센터</p>
          <h2>남은 확인</h2><p>정보 ${data.missing.length}개 · 서류 ${data.pendingDocs.length}개 · 점검 ${data.pendingChecks.length}개${data.undecidedDocs.length ? ' · 필요 여부가 정해지지 않은 서류 ' + data.undecidedDocs.length + '개' : ''}</p>
        </section>
      </div>
      <p class="paper-note">공식 신청서에 옮겨 적을 때 보는 참고 카드입니다. ‘확인 필요’ 금액은 확인 후에 적어 주세요. 제출 서류와 서명은 주민센터 안내를 따르세요.</p>
    </article>`;
  }

  function render() {
    const data = readiness();
    document.documentElement.classList.toggle('large-text', state.largeText);
    document.querySelector('.text-size').setAttribute('aria-pressed', String(state.largeText));
    if (screen === 2 && !data.visible.some(field => field.key === currentField)) {
      currentField = (data.missing[0] || data.visible[0])?.key ?? null;
      if (!currentField) screen = 3;
    }
    stepBar.innerHTML = steps.map(([label, short], index) => {
      const done = index < screen && (index < 2 || (index === 2 && data.missing.length === 0) || (index === 3 && data.ready));
      return `<span class="step ${index === screen ? 'is-current' : done ? 'is-done' : ''}"${screen === index ? ' aria-current="step"' : ''}>
        <span class="step-count" aria-hidden="true">${done ? '✓' : index + 1}</span>
        <span class="step-long">${esc(label)}</span><span class="step-short">${esc(short)}</span>
      </span>`;
    }).join('');
    if (screen === 0) view.innerHTML = overview();
    else if (screen === 1) view.innerHTML = formOverview();
    else if (screen === 2) view.innerHTML = questionScreen(data);
    else if (screen === 3) view.innerHTML = gapScreen(data);
    else view.innerHTML = cardScreen(data);
    printCard(data);
    storeProgress();
    if (pendingFocus) {
      Array.from(view.querySelectorAll(pendingFocus.kind === 'tab' ? '[data-action="tab"]' : 'input[data-' + pendingFocus.kind + ']'))
        .find(control => pendingFocus.kind === 'tab' ? control.dataset.key === pendingFocus.key
          : control.dataset[pendingFocus.kind] === pendingFocus.key)?.focus({ preventScroll: true });
      pendingFocus = null;
    }
  }

  function saveAnswer(answer) {
    const before = readiness();
    state.answers[currentField] = answer;
    const after = readiness();
    const requiredKeys = new Set(after.requiredDocs.map(doc => doc.sort_order));
    const checkKeys = new Set(after.activeChecks.map(check => check.sort_order));
    for (const doc of before.requiredDocs) if (!requiredKeys.has(doc.sort_order)) delete state.documents[doc.sort_order];
    for (const check of before.activeChecks) if (!checkKeys.has(check.sort_order)) delete state.checks[check.sort_order];
    if (returnScreen !== null) return go(returnScreen);
    const index = after.visible.findIndex(field => field.key === currentField);
    const next = after.visible.slice(index + 1).find(field => !state.answers[field.key]);
    if (next) chooseField(next.key);
    else go(3);
  }

  function sample() {
    const answers = {
      district: '노원구', dong: '상계동', household_size: 1, has_family_elsewhere: true,
      housing_type: 'monthly', deposit: 5000000, monthly_rent: 250000, has_work_income: false,
      has_other_income: true, has_car: false, has_debt: false, applicant_type: 'family', notice_method: 'sms',
    };
    state = {
      started: true, helper: 'family', largeText: state.largeText, documents: {}, checks: {},
      answers: Object.fromEntries(Object.entries(answers).map(([key, value]) => [key, { status: 'confirmed', value }])),
    };
    state.answers.savings = { status: 'unknown', value: null };
    state.answers.other_income_monthly = { status: 'approximate', value: 300000 };
    for (const doc of readiness().requiredDocs.slice(0, 2)) state.documents[doc.sort_order] = true;
    go(3);
  }

  document.addEventListener('click', event => {
    const target = event.target.closest('button[data-action]');
    if (!target) return;
    const { action, key } = target.dataset;
    switch (action) {
      case 'home': go(0); break;
      case 'font-size': state.largeText = !state.largeText; render(); break;
      case 'select': go(1); break;
      case 'sample': sample(); break;
      case 'role': if (roles[key]) { state.helper = key; render(); view.querySelector(`[data-action="role"][data-key="${key}"]`)?.focus({ preventScroll: true }); } break;
      case 'resume': go(Object.keys(state.answers).length ? 3 : 1); break;
      case 'start': {
        const next = readiness().visible.find(field => !state.answers[field.key]);
        if (next) chooseField(next.key);
        else go(3);
        break;
      }
      case 'edit': {
        const ready = readiness();
        const next = ready.missing[0] ?? ready.visible[0];
        if (next) chooseField(next.key, 3);
        break;
      }
      case 'edit-field': if (fieldByKey.has(key)) chooseField(key, 3); break;
      case 'edit-card-field': if (fieldByKey.has(key)) chooseField(key, 4); break;
      case 'unknown': inputMode = 'unknown'; render(); view.querySelector('[data-action="defer"]')?.focus({ preventScroll: true }); break;
      case 'abort-unknown': inputMode = 'answer'; render(); view.querySelector('#response, .options button')?.focus({ preventScroll: true }); break;
      case 'defer': saveAnswer({ status: 'unknown', value: null }); break;
      case 'approx': inputMode = 'approximate'; render(); document.getElementById('response')?.focus(); break;
      case 'choice': {
        const field = fieldByKey.get(currentField);
        if (!field) break;
        const value = field.type === 'yes_no' ? key === 'yes' : field.options?.[Number(key)]?.value;
        if (value !== undefined) saveAnswer({ status: 'confirmed', value });
        break;
      }
      case 'back-question': {
        if (returnScreen !== null) go(returnScreen);
        else {
          const visible = readiness().visible;
          const index = visible.findIndex(field => field.key === currentField);
          if (index > 0) chooseField(visible[index - 1].key);
          else go(1);
        }
        break;
      }
      case 'gaps': go(3); break;
      case 'card': activeTab = 'answers'; go(4); break;
      case 'tab': activeTab = key; pendingFocus = { kind: 'tab', key }; render(); break;
      case 'print': window.print(); break;
    }
  });

  view.addEventListener('input', event => {
    const field = fieldByKey.get(currentField);
    const output = document.getElementById('amount-preview');
    if (event.target.id === 'response' && field?.type === 'money' && output) {
      output.textContent = previewAmount(field, event.target.value);
    }
  });

  view.addEventListener('submit', event => {
    if (event.target.id !== 'answer-form') return;
    event.preventDefault();
    const field = fieldByKey.get(currentField);
    const valueField = event.target.elements.response;
    const text = valueField.value.trim();
    if (!field || !text) return;
    const value = field.type === 'money' || field.type === 'count' ? Number(text) : text;
    if (typeof value === 'number' && !Number.isSafeInteger(value)) return;
    if (field.type === 'district' && !districts.includes(value)) return;
    saveAnswer({ status: inputMode === 'approximate' ? 'approximate' : 'confirmed', value });
  });

  view.addEventListener('change', event => {
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || input.type !== 'checkbox') return;
    if (input.dataset.doc) {
      state.documents[input.dataset.doc] = input.checked;
      pendingFocus = { kind: 'doc', key: input.dataset.doc };
    } else if (input.dataset.check) {
      state.checks[input.dataset.check] = input.checked;
      pendingFocus = { kind: 'check', key: input.dataset.check };
    }
    render();
  });

  render();
})();
</script>
</body></html>
